[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document-ingestion-benchmark"
version = "0.1.0"
description = "Deterministic PDF-to-Markdown ingestion and structural preservation benchmark suite for Zipmd portfolio collaboration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Document Ingestion Engineering Team"}
]
keywords = ["pdf", "markdown", "benchmark", "document-ingestion", "evaluation", "nlp", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Framework :: FastAPI",
]
dependencies = [
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "reportlab>=4.0.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
docbench = "docbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
